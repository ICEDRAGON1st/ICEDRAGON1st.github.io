<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <link rel="stylesheet" href="styles.css?v=20260904h">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span id="hud-mode">2 Player</span>
      <span>Turn: <strong id="turn-label">Red</strong></span>
      <span id="record-wrap">Record: <strong id="record">—</strong></span>
    </div>
  </div>

  <main class="shell">
    <p class="hint">Click a column to drop your disc. Connect four in a row to win.</p>
    <div id="board" class="board" role="grid" aria-label="Connect Four board"></div>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Connect Four</h1>
      <p id="overlay-text">Drop discs and connect four in a row — horizontal, vertical, or diagonal.</p>
      <div id="mode-picker" class="picker" role="group" aria-label="Game mode">
        <button type="button" class="pick-btn active" data-mode="two">2 Player</button>
        <button type="button" class="pick-btn" data-mode="cpu">vs CPU</button>
      </div>
      <div id="difficulty-picker" class="picker hidden" role="group" aria-label="CPU difficulty">
        <button type="button" class="pick-btn active" data-diff="easy">Easy</button>
        <button type="button" class="pick-btn" data-diff="medium">Medium</button>
        <button type="button" class="pick-btn" data-diff="hard">Hard</button>
      </div>
      <div class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">New Game</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js"></script>
  <script src="script.js?v=20260904h"></script>
</body>
</html>
