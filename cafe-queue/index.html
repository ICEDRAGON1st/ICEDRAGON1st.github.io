<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../hub-game-boot.js?v=20260924a"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cafe Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260917aw">
</head>
<body>
  <header class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span>Score <strong id="score">0</strong></span>
      <span>Best <strong id="high-score">0</strong></span>
      <span>Served <strong id="served">0</strong></span>
      <span>Combo <strong id="combo">0</strong></span>
    </div>
  </header>
  <main class="shell">
    <div id="queue" class="queue" aria-live="polite"></div>
    <div class="counter">
      <p class="counter-label">Tap to serve</p>
      <div id="menu" class="menu-grid" role="group" aria-label="Cafe menu"></div>
    </div>
    <p class="hint">Match each guest’s order before their patience runs out. Perfect serves grow your combo.</p>
  </main>
  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Rush hour</p>
      <h1 id="overlay-title">Cafe Queue</h1>
      <p id="overlay-text" class="lead">Serve drinks and snacks as the line grows. Keep combos alive for bigger tips.</p>
      <p class="score-line">Best: <strong id="overlay-best">0</strong></p>
      <div class="overlay-actions">
        <button id="start-btn" type="button" class="btn">Open cafe</button>
        <button id="resume-btn" type="button" class="btn btn-ghost hidden">Resume</button>
        <button id="games-btn" type="button" class="btn btn-ghost">Games</button>
      </div>
    </div>
  </div>
  <script src="../hub-streak.js"></script>
  <script src="../hub-achievements.js?v=20260917aw"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-supabase.js?v=20260923u"></script>
  <script src="../hub-account-bag.js?v=20260923ag"></script>
  <script src="../hub-plays.js?v=20260923ae"></script>
  <script src="../hub-friends.js?v=20260923u"></script>
  <script src="../hub-chat.js?v=20260924f"></script>
<script src="../hub-leaderboard.js?v=20260923u"></script>
  <script src="script.js?v=20260917az"></script>
</body>
</html>
