<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../hub-game-boot.js?v=20261015ae"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Space Waves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261001fm">
</head>
<body>
  <main class="shell">
    <header class="hud">
      <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰</button>
      <button id="view-btn" type="button" class="menu-btn view-btn" aria-label="Toggle windowed view" title="Windowed / Fullscreen">Win</button>
      <div class="hud-stats">
        <span id="hud-mode">Lv 1</span>
        <span><strong id="progress">0%</strong></span>
        <span>Best <strong id="high-score">0</strong></span>
      </div>
    </header>
    <canvas id="game" width="960" height="540" aria-label="Space Waves"></canvas>
    <p class="hint" id="hint">Hold to rise · release to fall</p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Space Waves</h1>
      <p id="overlay-text" class="lead">Hold to fly up. Let go to fall. Reach the green finish line.</p>
      <p class="score-line">Best distance: <strong id="overlay-best">0</strong></p>

      <div class="mode-row" role="group" aria-label="Game mode">
        <button type="button" class="mode-btn active" data-mode="classic" title="12 handcrafted levels">
          <span class="mode-name">Levels</span>
          <span class="mode-desc">1 → 12</span>
        </button>
        <button type="button" class="mode-btn" data-mode="endless" title="How far can you go?">
          <span class="mode-name">Endless</span>
          <span class="mode-desc">Survive</span>
        </button>
      </div>

      <div id="classic-panel" class="classic-panel">
        <div class="panel-head">
          <span class="panel-label">Choose level</span>
          <span id="level-meta" class="level-meta">1 · Glide · easy</span>
        </div>
        <div id="level-picker" class="level-picker" aria-label="Levels"></div>
      </div>

      <div class="overlay-actions">
        <button id="start-btn" type="button" class="btn">Play</button>
        <button id="resume-btn" type="button" class="btn btn-ghost hidden">Resume</button>
        <button id="retry-btn" type="button" class="btn btn-ghost hidden">Retry</button>
        <button id="games-btn" type="button" class="btn btn-ghost">All games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js?v=20261015ae"></script>
  <script src="../hub-achievements.js?v=20261015ae"></script>
  <script src="../hub-confetti.js?v=20261015ae"></script>
  <script src="script.js?v=20261001fm"></script>
</body>
</html>
