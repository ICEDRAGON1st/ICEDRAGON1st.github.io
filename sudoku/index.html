<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="styles.css?v=20260904l">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span id="hud-diff">Easy</span>
      <span>Time: <strong id="timer">0:00</strong></span>
      <span>Best: <strong id="best">—</strong></span>
    </div>
  </div>

  <main class="shell">
    <p class="hint">Fill every row, column, and 3×3 box with digits 1–9.</p>
    <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
    <div class="controls">
      <div id="numpad" class="numpad" role="group" aria-label="Number pad"></div>
      <div class="action-row">
        <button id="notes-btn" type="button" class="action-btn">Notes: Off</button>
        <button id="erase-btn" type="button" class="action-btn">Erase</button>
        <button id="hint-btn" type="button" class="action-btn hidden" hidden disabled title="Hints are disabled for now">Hint</button>
      </div>
    </div>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Sudoku</h1>
      <p id="overlay-text">Classic 9×9 logic puzzle. Each digit appears once per row, column, and box.</p>
      <div id="difficulty-picker" class="difficulty-picker" role="group" aria-label="Difficulty">
        <button type="button" class="diff-btn active" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn" data-diff="medium">Medium</button>
        <button type="button" class="diff-btn" data-diff="hard">Hard</button>
      </div>
      <div class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">New Game</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260905s"></script>
  <script src="../hub-leaderboard.js?v=20260904o"></script>
  <script src="script.js?v=20260904o"></script>
</body>
</html>
