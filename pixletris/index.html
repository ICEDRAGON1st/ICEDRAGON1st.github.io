<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixletris</title>
  <link rel="stylesheet" href="styles.css?v=20260904l">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>Lines: <strong id="lines">0</strong></span>
      <span>Level: <strong id="level">1</strong></span>
      <span>Best: <strong id="high-score">0</strong></span>
    </div>
  </div>

  <main class="shell">
    <p class="hint">Blocks crumble into sand. Connect one color from left wall to right wall to clear. Arrow keys or WASD.</p>
    <canvas id="game" width="780" height="1200" aria-label="Pixletris game"></canvas>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Pixletris</h1>
      <p id="overlay-text">Blocks crumble into sand when they land. Bridge one color from the left wall to the right wall to clear it.</p>
      <div class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">Start</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260906e"></script>
  <script src="../hub-leaderboard.js?v=20260906e"></script>
  <script src="script.js?v=20260904l"></script>
</body>
</html>
