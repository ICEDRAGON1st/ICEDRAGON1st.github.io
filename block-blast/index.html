<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Block Blast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260908az">
</head>
<body>
  <header class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰</button>
    <div class="brand">
      <span class="brand-mark">Block</span>
      <span class="brand-blast">Blast</span>
    </div>
    <div class="hud-stats">
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat-box">
        <span class="stat-label">Best</span>
        <strong id="best">0</strong>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Block Blast board" role="grid"></div>
      <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
      <div id="praise" class="praise" hidden></div>
    </div>
    <div id="tray" class="tray" aria-label="Drag these blocks"></div>
    <p class="hint">Drag blocks onto the board. Clear full rows &amp; columns for combos.</p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Hungry-style puzzle</p>
      <h1 id="overlay-title">Block Blast</h1>
      <p id="overlay-text" class="lead">Drag colorful blocks onto the 8×8 board. Clear lines, chain combos, beat your best.</p>
      <p class="score-line">Best <strong id="overlay-best">0</strong></p>
      <div class="overlay-actions">
        <button id="start-btn" type="button" class="btn">Play</button>
        <button id="games-btn" type="button" class="btn btn-ghost">Games</button>
      </div>
    </div>
  </div>

  <div id="ghost" class="ghost" hidden></div>

  <script src="../hub-streak.js"></script>
  <script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260908az"></script>
  <script src="../hub-friends.js?v=20260907o"></script>
  <script src="../hub-chat.js?v=20260907p"></script>
  <script src="../hub-leaderboard.js?v=20260908az"></script>
  <script src="script.js?v=20260908az"></script>
</body>
</html>
