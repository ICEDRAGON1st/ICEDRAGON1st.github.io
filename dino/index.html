<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Dino Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260908al">
</head>
<body>
  <header class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span>Score <strong id="score">0</strong></span>
      <span>Best <strong id="high-score">0</strong></span>
    </div>
  </header>

  <main class="shell">
    <canvas id="game" width="900" height="320" aria-label="Dino Run game"></canvas>
    <p class="hint">Tap, click, or press <kbd>Space</kbd> / <kbd>↑</kbd> to jump. Duck with <kbd>↓</kbd>.</p>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">Endless runner</p>
      <h1 id="overlay-title">Dino Run</h1>
      <p id="overlay-text" class="lead">Jump over cacti, duck under birds, and see how far you can go.</p>
      <p class="score-line">Best: <strong id="overlay-best">0</strong></p>
      <div class="overlay-actions">
        <button id="start-btn" type="button" class="btn">Play</button>
        <button id="resume-btn" type="button" class="btn btn-ghost hidden">Resume</button>
        <button id="games-btn" type="button" class="btn btn-ghost">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script>
  <script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260908al"></script>
  <script src="../hub-friends.js?v=20260907o"></script>
  <script src="../hub-chat.js?v=20260907p"></script>
  <script src="../hub-leaderboard.js?v=20260908al"></script>
  <script src="script.js?v=20260908al"></script>
</body>
</html>
