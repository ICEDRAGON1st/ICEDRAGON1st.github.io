<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../hub-game-boot.js?v=20261001fy"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wing Hop</title>
  <link rel="stylesheet" href="styles.css?v=20261001cc">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span id="hud-skin">Classic</span>
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="high-score">0</strong></span>
    </div>
  </div>

  <canvas id="game" width="600" height="900" aria-label="Wing Hop game"></canvas>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Wing Hop</h1>
      <p id="overlay-text">Tap, click, or press Space to flap. Fly your dragon through the castle towers.</p>
      <p class="picker-label">Skins</p>
      <div id="skin-picker" class="skin-picker" role="group" aria-label="Player skin">
        <button type="button" class="skin-btn active" data-skin="classic">Dragon</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="ufo" data-coin-skin="skin:wing-hop-ufo">UFO · 350🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="plane" data-coin-skin="skin:wing-hop-plane">Paper · 250🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="bee" data-coin-skin="skin:wing-hop-bee">Bee · 250🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="sub" data-coin-skin="skin:wing-hop-sub">Sub · 300🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="balloon" data-coin-skin="skin:wing-hop-balloon">Balloon · 300🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="broom" data-coin-skin="skin:wing-hop-broom">Broom · 350🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="neon" data-coin-skin="skin:wing-hop-neon">Neon · 450🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="steam" data-coin-skin="skin:wing-hop-steam">Steam · 450🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="frost" data-coin-skin="skin:wing-hop-frost">Ice Fortress · 400🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="volcano" data-coin-skin="skin:wing-hop-volcano">Volcano · 400🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="ghost" data-coin-skin="skin:wing-hop-ghost">Ghost · 450🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="pixel" data-coin-skin="skin:wing-hop-pixel">Pixel-8 · 500🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="idol" data-coin-skin="skin:wing-hop-idol">Idol · 550🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="shadow" data-coin-skin="skin:wing-hop-shadow">Shadow · 500🪙</button>
        <button type="button" class="skin-btn skin-btn-locked" data-skin="rainbow" data-coin-skin="skin:wing-hop-rainbow">Rainbow · 500🪙</button>
      </div>
      <p id="skin-lock-hint" class="skin-lock-hint" aria-live="polite"></p>
      <div class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">Start</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-supabase.js?v=20260923u"></script>
  <script src="../hub-account-bag.js?v=20260923ag"></script>
  <script src="../hub-plays.js?v=20261001em"></script>
  <script src="../hub-coins.js?v=20261001em"></script>
  <script src="../hub-friends.js?v=20260923u"></script>
  <script src="../hub-chat.js?v=20260927c"></script>
  <script src="../hub-calls.js?v=20260925a"></script>
<script src="../hub-leaderboard.js?v=20260925a"></script>
  <script src="theme-packs.js?v=20261001dq"></script>
  <script src="script.js?v=20261001dg"></script>
</body>
</html>
