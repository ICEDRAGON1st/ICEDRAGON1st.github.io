<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <link rel="stylesheet" href="styles.css?v=20260905r">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span id="hud-theme">Classic</span>
      <span id="hud-diff">Easy</span>
      <span>Wins: <strong id="wins">0</strong></span>
      <span>Best streak: <strong id="best-streak">0</strong></span>
      <span>Streak: <strong id="streak">0</strong></span>
    </div>
    <button id="lang-btn" type="button" class="lang-btn" aria-label="Switch language" title="Switch language">EN</button>
  </div>

  <main class="shell">
    <section class="panel">
      <svg id="gallows" class="gallows" viewBox="0 0 220 260" aria-hidden="true">
        <line class="part part-base" x1="20" y1="240" x2="120" y2="240" />
        <line class="part part-pole" x1="50" y1="240" x2="50" y2="30" />
        <line class="part part-beam" x1="50" y1="30" x2="150" y2="30" />
        <line class="part part-rope" x1="150" y1="30" x2="150" y2="60" />
        <circle class="part part-head" cx="150" cy="80" r="20" />
        <line class="part part-body" x1="150" y1="100" x2="150" y2="160" />
        <line class="part part-arm-l" x1="150" y1="120" x2="120" y2="145" />
        <line class="part part-arm-r" x1="150" y1="120" x2="180" y2="145" />
        <line class="part part-leg-l" x1="150" y1="160" x2="125" y2="205" />
        <line class="part part-leg-r" x1="150" y1="160" x2="175" y2="205" />
      </svg>

      <p id="status" class="status">Guess a letter</p>
      <p id="theme-hint" class="theme-hint">Theme: Classic</p>
      <div id="word" class="word" aria-live="polite"></div>
      <p class="misses">Misses left: <strong id="misses">6</strong></p>
      <div id="keyboard" class="keyboard" role="group" aria-label="Letter keyboard"></div>
    </section>
  </main>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Hangman</h1>
      <p id="overlay-text">Guess the word one letter at a time.</p>
      <p class="picker-label">Theme</p>
      <div id="theme-picker" class="theme-picker" role="group" aria-label="Theme">
        <button type="button" class="theme-btn active" data-theme="classic">Classic</button>
        <button type="button" class="theme-btn" data-theme="animals">Animals</button>
        <button type="button" class="theme-btn" data-theme="food">Food</button>
        <button type="button" class="theme-btn" data-theme="flags">Flags</button>
        <button type="button" class="theme-btn" data-theme="sports">Sports</button>
        <button type="button" class="theme-btn" data-theme="nature">Nature</button>
        <button type="button" class="theme-btn" data-theme="space">Space</button>
        <button type="button" class="theme-btn" data-theme="music">Music</button>
        <button type="button" class="theme-btn" data-theme="movies">Movies</button>
      </div>
      <p class="picker-label">Difficulty</p>
      <div id="difficulty-picker" class="difficulty-picker" role="group" aria-label="Difficulty">
        <button type="button" class="diff-btn active" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn" data-diff="medium">Medium</button>
        <button type="button" class="diff-btn" data-diff="hard">Hard</button>
      </div>
      <div class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">Start</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../words-4.js"></script>
  <script src="../words.js"></script>
  <script src="../words-6.js"></script>
  <script src="../words-da-4.js"></script>
  <script src="../words-da.js"></script>
  <script src="../words-da-6.js"></script>
  <script src="../words-is-4.js"></script>
  <script src="../words-is.js"></script>
  <script src="../words-is-6.js"></script>
  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260905z"></script>
  <script src="../hub-leaderboard.js?v=20260905r"></script>
  <script src="themes.js?v=20260905r"></script>
  <script src="script.js?v=20260905r"></script>
</body>
</html>
