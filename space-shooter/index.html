<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter</title>
  <link rel="stylesheet" href="styles.css?v=20260904l">
</head>
<body>
  <div class="hud">
    <button id="menu-btn" type="button" class="menu-btn" aria-label="Open menu">☰ Menu</button>
    <div class="hud-stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>High: <strong id="high-score">0</strong></span>
      <span>Lives: <strong id="lives">5</strong></span>
      <span id="diff-label">Easy</span>
    </div>
  </div>

  <canvas id="game" width="1100" height="780" aria-label="Space shooter game"></canvas>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <h1 id="overlay-title">Space Shooter</h1>
      <p id="overlay-text">Move with your mouse or WASD. Shoot with Space or click.</p>
      <div id="difficulty-picker" class="difficulty-picker">
        <button type="button" class="diff-btn active" data-diff="easy">Easy</button>
        <button type="button" class="diff-btn" data-diff="medium">Medium</button>
        <button type="button" class="diff-btn" data-diff="hardcore">Hardcore</button>
      </div>
      <div id="overlay-actions" class="overlay-actions">
        <button id="resume-btn" type="button" class="btn btn-secondary hidden">Resume</button>
        <button id="view-board-btn" type="button" class="btn btn-secondary hidden">View board</button>
        <button id="start-btn" type="button" class="btn">Start</button>
        <button id="games-btn" type="button" class="btn btn-secondary">Games</button>
      </div>
    </div>
  </div>

  <script src="../hub-streak.js"></script><script src="../hub-achievements.js"></script>
  <script src="../hub-sound.js"></script>
  <script src="../hub-confetti.js"></script>
  <script src="../hub-plays.js?v=20260906f"></script>
  <script src="../hub-leaderboard.js?v=20260906f"></script>
  <script src="script.js?v=20260904l"></script>
</body>
</html>
